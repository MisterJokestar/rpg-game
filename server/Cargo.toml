[package]
name = "server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Uuid
uuid = { version = "1.7", features = ["v7", "fast-rng", "serde"] }

# Security
bcrypt = "0.19" 

# Random
rand = { version = "0.10.1", features = ["thread_rng"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Env / config
dotenvy = "0.15"

# Async streams (used by MongoDB cursor)
futures = "0.3"

# --- Database backends ---
# Google Firestore (production)
# Check crates.io for the latest 0.x version before building
firestore = { version = "0.44", optional = true }

# MongoDB (local development)
mongodb = { version = "3", optional = true }

[features]
default = ["firestore"]
firestore = ["dep:firestore"]
mongodb = ["dep:mongodb"]
