# Frontend only — start with: docker compose -f docker-compose.frontend.yml up
# Port is read from frontend/.env
# When running alongside the backend, VITE_SERVER_BASE_URL is overridden below
# so the SSR container reaches the server container by its Docker service name.
env_file:
  - ./frontend/.env

services:
  frontend:
    build:
      context: ./frontend
    container_name: local-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - ./frontend/.env
    environment:
      # SSR runs inside this container, so it must reach the server by service name.
      # Override to http://localhost:5000 if running the server on the host instead.
      VITE_SERVER_BASE_URL: http://server:5000
    networks:
      - app

networks:
  app:
    name: finalproj-network
